name: test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install required search tool
        run: |
          sudo apt-get update
          sudo apt-get install --yes ripgrep
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest
